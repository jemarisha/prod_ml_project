[project]
name = "youarebot"
version = "0.1.0"
description = "Bot-or-human classifier for dialog participants (Production ML course project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "catboost>=1.2.8",
    "matplotlib>=3.9",
    "mlflow>=3.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pandera>=0.24",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    { include-group = "serve" },
]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
eda = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "seaborn>=0.13",
]

[project.scripts]
youarebot = "youarebot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youarebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
