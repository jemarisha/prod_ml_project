run_name: 10_stack_logits
description: >-
  Стекинг: логрегрессия поверх логитов трёх моделей — логрегрессии на TF-IDF и CatBoost
  с началами диалогов и CatBoost без них. Метамодель учится на внутренней групповой CV.
augment:
  prefixes_per_dialog: 4
  prefix_weight: 0.5
model:
  type: stack
  params:
    n_splits: 5
    C: 1.0
  components:
    - type: logreg
      use_prefixes: true
      use_handcrafted: true
      tfidf:
        - {column: text_self, analyzer: word, ngram_range: [1, 2], min_df: 2, max_features: 20000, lowercase: true}
        - {column: text_self, analyzer: char_wb, ngram_range: [2, 5], min_df: 3, max_features: 50000, lowercase: false}
        - {column: text_other, analyzer: word, ngram_range: [1, 1], min_df: 3, max_features: 10000, lowercase: true}
      params:
        C: 2.0
    - &catboost_text
      type: catboost
      use_prefixes: true
      use_handcrafted: true
      text_columns: [text_self, text_other]
      params:
        iterations: 800
        learning_rate: 0.03
        depth: 6
        l2_leaf_reg: 5
        text_processing:
          tokenizers:
            - {tokenizer_id: Space, separator_type: ByDelimiter, delimiter: " ", lowercasing: "true"}
          dictionaries:
            - {dictionary_id: Word, max_dictionary_size: "5000", occurrence_lower_bound: "3", gram_order: "1"}
            - {dictionary_id: BiGram, max_dictionary_size: "5000", occurrence_lower_bound: "3", gram_order: "2"}
          feature_processing:
            default:
              - {dictionaries_names: [Word, BiGram], feature_calcers: [NaiveBayes, BM25], tokenizers_names: [Space]}
    # Та же модель без начал диалогов: её ошибки отличаются, и стекинг на этом выигрывает.
    - <<: *catboost_text
      use_prefixes: false
